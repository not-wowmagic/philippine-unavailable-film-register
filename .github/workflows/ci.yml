name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate data and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate and build
        run: npm run build
